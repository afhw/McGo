name: Sign C# Preview

on:
  push:
    branches:
      - codex/winui3-csharp-migration
  workflow_dispatch:

concurrency:
  group: sign-csharp-preview
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run core tests
        shell: pwsh
        run: dotnet run --project tests/McGo.Core.Tests/McGo.Core.Tests.csproj

      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing SignPath repository configuration: $($missing -join ', ')"
          }

      - name: Build unsigned installer
        shell: pwsh
        run: ./scripts/build_csharp_installer.ps1 -OutputDirectory artifacts/unsigned

      - name: Test unsigned installer
        shell: pwsh
        run: |
          $setup = Resolve-Path artifacts/unsigned/McGo-CSharp-Preview-x64-Setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP "mcgo-unsigned-smoke"
          $report = Join-Path $env:RUNNER_TEMP "mcgo-unsigned-smoke.txt"
          $process = Start-Process $setup -ArgumentList @(
            "--installer-smoke",
            "--install-dir=$installDir",
            "--smoke-report=$report"
          ) -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: mcgo-csharp-preview-unsigned
          path: artifacts/unsigned/McGo-CSharp-Preview-x64-Setup.exe
          compression-level: 0
          retention-days: 7

      - name: Submit SignPath request
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed

      - name: Verify signed installer
        id: verify-signed
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/signed -Recurse -File -Filter McGo-CSharp-Preview-x64-Setup.exe |
            Select-Object -First 1
          if (-not $setup) { throw "SignPath did not return the expected installer." }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne "Valid") {
            throw "Signed installer signature status is $($signature.Status)."
          }
          $installDir = Join-Path $env:RUNNER_TEMP "mcgo-signed-smoke"
          $report = Join-Path $env:RUNNER_TEMP "mcgo-signed-smoke.txt"
          $process = Start-Process $setup.FullName -ArgumentList @(
            "--installer-smoke",
            "--install-dir=$installDir",
            "--smoke-report=$report"
          ) -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$($setup.FullName).sha256",
            "$hash  $($setup.Name)`n",
            [Text.Encoding]::ASCII)
          "setup-directory=$($setup.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: mcgo-csharp-preview-signed
          path: ${{ steps.verify-signed.outputs.setup-directory }}/*
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "csharp-preview-$shortSha"
          $directory = "${{ steps.verify-signed.outputs.setup-directory }}"
          $setup = Join-Path $directory "McGo-CSharp-Preview-x64-Setup.exe"
          $checksum = "$setup.sha256"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $checksum --clobber
          }
          else {
            gh release create $tag $setup $checksum `
              --target $env:GITHUB_SHA `
              --prerelease `
              --title "McGo C# Preview $shortSha" `
              --notes "Automated WinUI 3 preview build from commit $env:GITHUB_SHA. Signed through SignPath and verified by the installer smoke test."
          }
