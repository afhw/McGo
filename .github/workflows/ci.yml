name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build McGo.slnx
      - run: dotnet run --project tests/McGo.Core.Tests/McGo.Core.Tests.csproj
